<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAMELAND — By Pebbles The Penguin</title>
  <style>
    :root {
      --bg: #060b16;
      --sidebar: #09101f;
      --card: #0e172a;
      --card-hover: #13203b;
      --border: #1b2842;
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --purple: #a855f7;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #8b9bb4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    }
    /* Modals */
    .overlay {
      position: fixed; inset: 0; background: rgba(3, 6, 14, 0.94);
      display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
    }
    .modal-box {
      background: #0b1324; border: 1px solid var(--cyan); border-radius: 16px;
      width: 100%; max-width: 400px; padding: 1.6rem; box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.1rem; }
    .tab-btn {
      flex: 1; padding: 0.58rem; border-radius: 9px; border: 1px solid var(--border);
      background: #070d19; color: var(--muted); font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: var(--cyan); color: #04101f; border-color: var(--cyan); }
    .field { margin-bottom: 0.9rem; }
    .field label { display: block; font-size: 0.76rem; color: var(--cyan); margin-bottom: 0.3rem; font-weight: 700; }
    .field input {
      width: 100%; padding: 0.62rem 0.85rem; border-radius: 9px; border: 1px solid var(--border);
      background: #060b16; color: #fff; font-size: 0.92rem; outline: none;
    }
    .btn-cyan {
      background: linear-gradient(90deg, #0284c7, #38bdf8); color: #04101f; border: none;
      padding: 0.6rem 1.05rem; border-radius: 9px; font-weight: 800; cursor: pointer; font-size: 0.86rem;
    }
    /* Top Navbar */
    .topbar {
      height: 60px; background: #080e1c; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; gap: 0.6rem; position: sticky; top: 0; z-index: 40;
    }
    .nav-group { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 0.55rem; cursor: pointer; }
    .brand-logo {
      width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #1d4ed8, #38bdf8);
      display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
    }
    .count-pill {
      background: #111c33; border: 1px solid var(--border); color: var(--cyan);
      padding: 0.22rem 0.55rem; border-radius: 7px; font-size: 0.72rem; font-weight: 800;
    }
    .search-bar {
      background: #0d1629; border: 1px solid var(--border); border-radius: 9px;
      padding: 0.4rem 0.8rem; color: #fff; width: 210px; outline: none; font-size: 0.84rem;
    }
    .top-btn {
      background: #0f192e; border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.72rem; border-radius: 8px; font-size: 0.76rem; font-weight: 700; cursor: pointer;
    }
    .top-btn:hover { border-color: var(--cyan); }
    .top-btn.vip { background: rgba(245, 158, 11, 0.14); border-color: var(--gold); color: #fbbf24; }
    .top-btn.cloud { background: rgba(168, 85, 247, 0.14); border-color: var(--purple); color: #d8b4fe; }
    .top-btn.admin { background: rgba(239, 68, 68, 0.14); border-color: var(--red); color: #fca5a5; }
    /* Workspace & Sidebar */
    .workspace { display: flex; flex: 1; }
    .sidebar {
      width: 245px; background: var(--sidebar); border-right: 1px solid var(--border);
      padding: 0.9rem 0.7rem; display: flex; flex-direction: column; gap: 0.85rem; flex-shrink: 0;
    }
    .sidebar.collapsed { display: none; }
    .side-head { font-size: 0.65rem; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; padding: 0 0.5rem; text-transform: uppercase; }
    .side-btn {
      width: 100%; background: transparent; border: 1px solid transparent; color: #cbd5e1;
      padding: 0.48rem 0.65rem; border-radius: 8px; font-size: 0.81rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.18rem;
    }
    .side-btn:hover, .side-btn.active { background: rgba(56, 189, 248, 0.13); border-color: rgba(56, 189, 248, 0.35); color: var(--cyan); }
    .mini-tag { font-size: 0.62rem; font-weight: 900; padding: 0.14rem 0.4rem; border-radius: 5px; }
    .tag-new { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .tag-vip-sm { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .tag-wtp { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    .user-box {
      background: #0c1528; border: 1px solid var(--border); border-radius: 10px;
      padding: 0.65rem; display: flex; align-items: center; justify-content: space-between;
    }
    /* Main Content */
    .main { flex: 1; padding: 1.35rem; max-width: 1400px; margin: 0 auto; width: 100%; }
    .hero {
      background: radial-gradient(circle at top right, #162e58, #0b1324 72%);
      border: 1px solid var(--border); border-radius: 16px; padding: 1.45rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1.25rem;
      flex-wrap: wrap; margin-bottom: 1.15rem;
    }
    .pebbles-panel {
      background: rgba(8, 14, 28, 0.85); border: 1px solid var(--border); border-radius: 13px;
      padding: 0.9rem; width: 300px; display: flex; gap: 0.8rem; align-items: center;
    }
    .filter-row {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.1rem;
    }
    .chip-bar { display: flex; gap: 0.38rem; flex-wrap: wrap; }
    .chip {
      background: #0e172a; border: 1px solid var(--border); color: var(--muted);
      padding: 0.3rem 0.65rem; border-radius: 7px; font-size: 0.76rem; font-weight: 600; cursor: pointer;
    }
    .chip.active, .chip:hover { background: var(--cyan); color: #04101f; border-color: var(--cyan); }
    /* Game Cards Matching Screenshot */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 1.05rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 13px;
      overflow: hidden; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--cyan); background: var(--card-hover); }
    .card-thumb {
      height: 128px; position: relative; display: flex; align-items: center; justify-content: center; font-size: 3rem;
    }
    .cat-badge {
      position: absolute; top: 9px; left: 9px; background: rgba(6, 11, 22, 0.82);
      border: 1px solid var(--border); padding: 0.18rem 0.48rem; border-radius: 5px;
      font-size: 0.63rem; font-weight: 800; text-transform: uppercase;
    }
    .pick-badge {
      position: absolute; top: 9px; left: 78px; background: rgba(56, 189, 248, 0.22);
      color: var(--cyan); border: 1px solid var(--cyan); padding: 0.18rem 0.45rem;
      border-radius: 5px; font-size: 0.63rem; font-weight: 800;
    }
    .vip-gold-badge {
      position: absolute; top: 34px; left: 9px; background: rgba(245, 158, 11, 0.25);
      color: #fbbf24; border: 1px solid var(--gold); padding: 0.18rem 0.48rem;
      border-radius: 5px; font-size: 0.63rem; font-weight: 900;
    }
    .cloud-badge {
      position: absolute; top: 34px; left: 9px; background: rgba(168, 85, 247, 0.28);
      color: #e9d5ff; border: 1px solid var(--purple); padding: 0.18rem 0.48rem;
      border-radius: 5px; font-size: 0.63rem; font-weight: 900;
    }
    .fav-heart {
      position: absolute; top: 8px; right: 8px; background: rgba(6, 11, 22, 0.78);
      border: 1px solid var(--border); width: 27px; height: 27px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer;
    }
    .card-body { padding: 0.85rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: 800; font-size: 0.96rem; margin-bottom: 0.28rem; }
    .card-desc { font-size: 0.76rem; color: var(--muted); line-height: 1.38; margin-bottom: 0.7rem; }
    .card-footer { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); font-weight: 600; }
    /* Floating Pebbles Hub (Bottom Right like Screenshot) */
    .pebbles-hub {
      position: fixed; bottom: 14px; right: 14px; background: #0b1426; border: 1px solid var(--cyan);
      border-radius: 14px; padding: 0.55rem 0.85rem; display: flex; align-items: center; gap: 0.65rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 50; font-size: 0.78rem;
    }
    .hub-btn {
      background: #132240; border: 1px solid var(--border); color: #e2e8f0;
      padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    /* Shop & Admin */
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .vip-card { background: var(--card); border: 1px solid rgba(245, 158, 11, 0.45); border-radius: 14px; padding: 1.2rem; }
    .admin-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 900px) { .admin-grid { grid-template-columns: 1fr; } }
    .console-box { background: #040812; border: 1px solid var(--cyan); border-radius: 13px; padding: 0.95rem; font-family: monospace; display: flex; flex-direction: column; height: 400px; }
.console-log { flex: 1; overflow-y: auto; font-size: 0.78rem; color: #7dd3fc; margin-bottom: 0.6rem; }
.user-table { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
.user-table th, .user-table td { padding: 0.55rem; border-bottom: 1px solid var(--border); text-align: left; }
.mini-btn { background: #132240; border: 1px solid var(--border); color: #fff; padding: 0.25rem 0.48rem; border-radius: 5px; font-size: 0.69rem; cursor: pointer; margin: 2px; }
#gameFrame, #gameCanvas { width: 100%; height: 540px; border-radius: 13px; border: 1px solid var(--cyan); background: #000; }
.toast {
position: fixed; top: 72px; right: 18px; background: #0d182e; border: 1px solid var(--cyan);
color: #fff; padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.82rem; font-weight: 700; z-index: 12000; display: none;
}

const todayKey = new Date().toISOString().slice(0, 10);
let db = JSON.parse(localStorage.getItem("gameland_users_db") || "{}");
let currentUser = sessionStorage.getItem("gameland_session_user") || null;
let adminUnlocked = false, authMode = "login", currentFilter = "All", currentTag = "All", animLoop = null, disguised = false;
function saveDB() { localStorage.setItem("gameland_users_db", JSON.stringify(db)); updateHUD(); }
function showToast(m) {
const t = document.getElementById("toast");
t.textContent = m; t.style.display = "block";
clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 3200);
}
function checkBanStatus(u) {
if (!u) return null;
if (u.banned) return "Account permanently banned by an administrator.";
if (u.banUntil && Date.now() < u.banUntil) {
return Temporarily banned. Try again in ${Math.ceil((u.banUntil - Date.now()) / 60000)} minute(s).;
}
if (u.banUntil && Date.now() >= u.banUntil) { u.banUntil = 0; saveDB(); }
return null;
}
document.getElementById("tabLogin").onclick = () => {
authMode = "login";
document.getElementById("tabLogin").classList.add("active");
document.getElementById("tabSignup").classList.remove("active");
document.getElementById("authSubmitBtn").textContent = "Log In →";
document.getElementById("authError").style.display = "none";
};
document.getElementById("tabSignup").onclick = () => {
authMode = "signup";
document.getElementById("tabSignup").classList.add("active");
document.getElementById("tabLogin").classList.remove("active");
document.getElementById("authSubmitBtn").textContent = "Create Account →";
document.getElementById("authError").style.display = "none";
};
document.getElementById("authSubmitBtn").onclick = () => {
const user = document.getElementById("authUser").value.trim().toLowerCase();
const pass = document.getElementById("authPass").value;
const err = document.getElementById("authError");
if (user.length < 3 || pass.length < 4) {
err.textContent = "Username (3+ chars) and Password (4+ chars) required.";
err.style.display = "block"; return;
}
if (authMode === "signup") {
if (db[user]) { err.textContent = "Username already taken."; err.style.display = "block"; return; }
db[user] = { username: user, pass, coins: 5, dailyDate: todayKey, dailyEarned: 0, vip: "none", favorites: [], happiness: 85, banned: false, banUntil: 0 };
saveDB(); showToast(🎉 Welcome @${user}! +5 starter tokens.);
} else {
if (!db[user] || (db[user].pass !== pass && db[user].passHash !== pass)) {
err.textContent = "Invalid username or password."; err.style.display = "block"; return;
}
const banMsg = checkBanStatus(db[user]);
if (banMsg) { err.textContent = banMsg; err.style.display = "block"; return; }
}
currentUser = user;
sessionStorage.setItem("gameland_session_user", user);
document.getElementById("authModal").style.display = "none";
updateHUD(); renderGames();
};
function logoutUser() {
sessionStorage.removeItem("gameland_session_user");
currentUser = null; adminUnlocked = false; switchView("games");
document.getElementById("authModal").style.display = "flex";
}
function updateHUD() {
const u = db[currentUser]; if (!u) return;
if (u.dailyDate !== todayKey) { u.dailyDate = todayKey; u.dailyEarned = 0; }
if (!Array.isArray(u.favorites)) u.favorites = [];
document.getElementById("topCoinPill").textContent = Math.floor(u.coins);
document.getElementById("sideCoinTag").textContent = Math.floor(u.coins);
document.getElementById("dailyPill").textContent = ${u.dailyEarned}/20 Today;
document.getElementById("sideUser").textContent = ${u.username} (${u.vip.toUpperCase()});
document.getElementById("tierVal").textContent = u.vip.toUpperCase();
document.getElementById("happyVal").textContent = ${u.happiness || 85}%;
document.getElementById("favCountTag").textContent = u.favorites.length;
}
function openAdminGate() {
if (adminUnlocked) return switchView("admin");
document.getElementById("adminLockErr").style.display = "none";
document.getElementById("adminPassInput").value = "";
document.getElementById("adminLockModal").style.display = "flex";
}
document.getElementById("adminCancelBtn").onclick = () => document.getElementById("adminLockModal").style.display = "none";
document.getElementById("adminUnlockBtn").onclick = () => {
const val = document.getElementById("adminPassInput").value;
if (val === "pebbles2026" || val === "admin") {
adminUnlocked = true;
document.getElementById("adminLockModal").style.display = "none";
logConsole("✓ Admin authenticated.");
switchView("admin");
} else document.getElementById("adminLockErr").style.display = "block";
};
function logConsole(msg) {
const box = document.getElementById("consoleLog");
const d = document.createElement("div");
d.textContent = [${new Date().toLocaleTimeString()}] ${msg};
box.appendChild(d); box.scrollTop = box.scrollHeight;
}
document.getElementById("consoleExecBtn").onclick = () => {
if (!adminUnlocked) return;
const raw = document.getElementById("consoleCmd").value.trim();
document.getElementById("consoleCmd").value = "";

else if (cmd === "/ban" && db[target]) { db[target].banned = true; saveDB(); renderAdminUsers(); logConsole(Permanently banned @${target}.); }
else if (cmd === "/tempban" && db[target] && Number(p) > 0) { db[target].banUntil = Date.now() + Number(p) * 60000; saveDB(); renderAdminUsers(); logConsole(Temp-banned @${target} for ${p}m.); }
else if (cmd === "/unban" && db[target]) { db[target].banned = false; db[target].banUntil = 0; saveDB(); renderAdminUsers(); logConsole(Unbanned @${target}.); }

async function launchGame(g) {
const u = db[currentUser];
if (!u || checkBanStatus(u)) { logoutUser(); return; }
if (u.dailyEarned < 20) {
const mult = u.vip === "diamond" ? 2 : (u.vip === "platinum" ? 1.5 : (u.vip === "gold" ? 1.25 : 1));
u.coins += 1 * mult; u.dailyEarned += 1; saveDB();
showToast(🪙 +${1 * mult} Token! (${u.dailyEarned}/20 today));
}
switchView("player");
document.getElementById("activeGameTitle").textContent = ${g.icon} ${g.title};
const frame = document.getElementById("gameFrame"), canvas = document.getElementById("gameCanvas");
// Check if the open-source game folder exists in your GitHub repo (games/.../index.html)
try {
const res = await fetch(g.url, { method: "HEAD" });
if (res.ok) {
canvas.style.display = "none";
frame.style.display = "block";
frame.src = g.url;
return;
}
} catch (_) {}
// Fallback engine if you haven't uploaded the games/... folder to GitHub yet
frame.style.display = "none"; frame.src = "";
canvas.style.display = "block";
showToast(Tip: Upload "${g.url}" to your GitHub repo to load the full open-source build!);
runFallback(g.fallback);
}
function launchRandom() {
const rank = TIER_RANK[db[currentUser]?.vip] || 0;

launchGame(pool[Math.floor(Math.random() * pool.length)]);
}
function runFallback(mode) {
const c = document.getElementById("gameCanvas"), ctx = c.getContext("2d");
let keys = {}, score = 0, px = 420, py = 360, vy = 0, items = [], bullets = [];
let snake = [{x:10,y:10}], dir = {x:1,y:0}, food = {x:15,y:10}, tick = 0;
window.onkeydown = e => {
keys[e.key] = true;
if (e.key === "ArrowUp" && dir.y === 0) dir = {x:0,y:-1};
if (e.key === "ArrowDown" && dir.y === 0) dir = {x:0,y:1};
if (e.key === "ArrowLeft" && dir.x === 0) dir = {x:-1,y:0};
if (e.key === "ArrowRight" && dir.x === 0) dir = {x:1,y:0};
if (e.key === " ") bullets.push({ x: px + 18, y: 420 });
};
window.onkeyup = e => keys[e.key] = false;
function loop() {
ctx.fillStyle = "#060b16"; ctx.fillRect(0, 0, 900, 500);
if (mode === "snake") {
if (++tick % 6 === 0) {
const head = { x: (snake.x + dir.x + 30) % 30, y: (snake.y + dir.y + 16) % 16 };
if (snake.some(s => s.x === head.x && s.y === head.y)) { snake = [{x:10,y:10}]; score = 0; }
else { snake.unshift(head); if (head.x === food.x && head.y === food.y) { score += 10; food = { x: Math.floor(Math.random()*30), y: Math.floor(Math.random()*16) }; } else snake.pop(); }
}
ctx.fillStyle = "#f43f5e"; ctx.fillRect(food.x * 30 + 4, food.y * 30 + 4, 22, 22);
ctx.fillStyle = "#38bdf8"; snake.forEach(s => ctx.fillRect(s.x * 30 + 2, s.y * 30 + 2, 26, 26));
} else {
if (keys["ArrowLeft"] || keys["a"]) px = Math.max(20, px - 8);
if (keys["ArrowRight"] || keys["d"]) px = Math.min(840, px + 8);
if (Math.random() < 0.04) items.push({ x: Math.random() * 850, y: -20 });
ctx.font = "36px serif"; ctx.fillText("🐧", px, 450);
items.forEach((it, ii) => {
it.y += 5; ctx.fillText("🧊", it.x, it.y);
if (it.y > 410 && it.y < 460 && Math.abs(it.x - px) < 30) { score = 0; items = []; }
if (it.y > 500) { items.splice(ii, 1); score += 5; }
});
}
ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif";
ctx.fillText(SCORE: ${score}  |  Upload open-source game folder to GitHub to play full version, 22, 32);
animLoop = requestAnimationFrame(loop);
}
cancelAnimationFrame(animLoop); loop();
}
